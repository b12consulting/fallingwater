[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fallingwater"
version = "0.1.0"
description = "Composable Pydantic AI agents with Redis-backed conversations"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim>=2.54,<3",
  "redis>=6,<8",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
web = ["fastapi>=0.135,<1", "jinja2>=3.1,<4", "uvicorn>=0.30,<1"]
openai = ["pydantic-ai-slim[openai]>=2.54,<3"]
test = [
  "pytest>=8,<10",
  "typeguard>=4,<5",
]

[project.scripts]
fw = "fallingwater.cli:main"

[tool.setuptools]
packages = ["fallingwater", "fallingwater.demo", "fallingwater.web"]

[tool.setuptools.package-data]
"fallingwater.web" = ["templates/*.html"]

[tool.black]
line-length = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
